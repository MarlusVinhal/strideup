<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrideUp Admin - Parcerias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-image: url('/img/fundo-run.jpg'); }
        [data-theme="dark"] { --overlay-color: rgba(15, 16, 21, 0.85); --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --neon-color: #00ffaa; --text-main: #ffffff; --text-muted: #a0aab5; }
        [data-theme="light"] { --overlay-color: rgba(0, 0, 0, 0.15); --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.35); --neon-color: #00ffaa; --text-main: #ffffff; --text-muted: #e2e8f0; }
        body { background-image: var(--bg-image); background-size: cover; background-position: center; background-attachment: fixed; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--text-main); }
        .admin-wrapper { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; background-color: var(--overlay-color); backdrop-filter: blur(8px); }
        .text-neon { color: var(--neon-color) !important; }
        .bg-glass { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 1.5rem; padding: 3rem; width: 100%; max-width: 500px; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .form-control { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-main); }
        .form-control:focus { background: rgba(255, 255, 255, 0.1); border-color: var(--neon-color); color: var(--text-main); box-shadow: 0 0 0 0.25rem rgba(0, 255, 170, 0.25); }
        .btn-neon { background: transparent; border: 2px solid var(--neon-color); color: var(--neon-color); font-weight: bold; transition: all 0.3s ease; }
        .btn-neon:hover { background: var(--neon-color); color: #000; box-shadow: 0 0 10px var(--neon-color); }
        .theme-btn { position: absolute; top: 20px; right: 25px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.4rem; transition: color 0.3s; }
        .theme-btn:hover { color: var(--neon-color); }
        .list-group-item-custom { background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); color: var(--text-main); transition: 0.2s; }
        .list-group-item-custom:hover { border-color: var(--neon-color); background: rgba(0, 255, 170, 0.1); }
    </style>
</head>
<body>
<div class="admin-wrapper">
    <div class="bg-glass text-center">
        <!-- ÍCONE DE TEMA -->
        <button class="theme-btn" onclick="toggleTheme()" id="themeIconBtn"><i class="fas fa-moon"></i></button>

        <h3 class="fw-bold mb-1 text-white"><i class="fas fa-handshake text-neon me-2"></i>Gerenciar Parcerias</h3>
        <p class="text-white-50 mb-4 small" th:text="${parceria?.id != null ? 'Editando marca parceira' : 'Cadastre uma nova marca'}"></p>

        <form action="/admin/parcerias/salvar" method="post">
            <input type="hidden" name="id" th:value="${parceria?.id}">

            <div class="mb-3 text-start">
                <label class="form-label small text-white-50 ms-1">Nome da Empresa / Marca</label>
                <input type="text" name="nomeEmpresa" class="form-control rounded-pill px-4 py-2" th:value="${parceria?.nomeEmpresa}" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label small text-white-50 ms-1">URL do Logótipo (Opcional)</label>
                <input type="url" name="logotipoUrl" class="form-control rounded-pill px-4 py-2" th:value="${parceria?.logotipoUrl}">
            </div>
            <button type="submit" class="btn btn-neon rounded-pill w-100 py-2 mb-3"><i class="fas fa-save me-2"></i> SALVAR</button>
            <a th:if="${parceria?.id != null}" href="/admin/parcerias/nova" class="btn btn-outline-secondary rounded-pill w-100 py-2 mb-3">Cancelar Edição</a>
        </form>

        <!-- LISTA PARA CLICAR E EDITAR -->
        <hr class="border-secondary mt-4 mb-4">
        <h6 class="text-white-50 text-start small fw-bold mb-3 text-uppercase">Marcas Cadastradas</h6>
        <div class="list-group text-start" style="max-height: 150px; overflow-y: auto; border-radius: 1rem;">
            <a th:each="p : ${listaParcerias}" th:href="@{/admin/parcerias/nova(id=${p.id})}" class="list-group-item list-group-item-custom d-flex justify-content-between align-items-center text-decoration-none">
                <span th:text="${p.nomeEmpresa}" class="small fw-bold"></span>
                <i class="fas fa-edit text-neon"></i>
            </a>
        </div>

        <div class="mt-4"><a href="/dashboard" class="text-white-50 text-decoration-none small"><i class="fas fa-arrow-left me-1"></i> Voltar ao Dashboard</a></div>
    </div>
</div>
<script>
    function toggleTheme() {
        const html = document.documentElement;
        const newTheme = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('strideup-theme', newTheme);
        document.getElementById('themeIconBtn').innerHTML = newTheme === 'light' ? '<i class="fas fa-sun" style="color: #f39c12;"></i>' : '<i class="fas fa-moon"></i>';
    }
    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('strideup-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.getElementById('themeIconBtn').innerHTML = savedTheme === 'light' ? '<i class="fas fa-sun" style="color: #f39c12;"></i>' : '<i class="fas fa-moon"></i>';
    });
</script>
</body>
</html>
