<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrideUp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('/img/fundo-run.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        /* Efeito de Vidro Fosco (Glassmorphism) */
        .card-custom {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 1.5rem;
            color: #ffffff;
            position: relative;
            z-index: 1;
        }

        /* Animações da Logomarca */
        .icon-running {
            display: inline-block;
            color: #00ffaa;
            filter: drop-shadow(0 0 8px rgba(0,255,170,0.8));
            animation: run-motion 0.5s infinite alternate ease-in-out;
        }
        @keyframes run-motion {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(12deg); }
        }

        .text-animated {
            background: linear-gradient(90deg, #00ffaa 0%, #ffffff 50%, #00ffaa 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
            display: inline-block;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Campos e Botões */
        .form-control {
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }
        .form-control:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
            color: #ffffff;
        }
        .form-floating label {
            color: #a0aab5;
        }
        .form-floating>.form-control:focus~label,
        .form-floating>.form-control:not(:placeholder-shown)~label {
            color: #00ffaa;
        }
        .btn-neon {
            background: transparent;
            color: #00ffaa;
            border: 2px solid #00ffaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            background: #00ffaa;
            color: #000000;
            box-shadow: 0 0 20px #00ffaa;
        }
    </style>
</head>
<body>
<div class="page-overlay"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            <div class="card card-custom p-4 p-md-5 text-center">

                <div class="mb-4">
                    <h2 class="fw-bold mb-2" style="font-size: 2.5rem;">
                        <i class="fas fa-running me-2 icon-running"></i><span class="text-animated">StrideUp</span>
                    </h2>
                    <p class="text-light opacity-75 small">A Corrida Social que Conecta, Motiva e Recompensa</p>
                </div>

                <form th:action="@{/login}" method="post">

                    <div th:if="${param.error}" class="alert alert-danger p-2 mb-3 small fw-bold" style="background: rgba(220,53,69,0.7); color: white; border: none;">
                        E-mail ou senha inválidos.
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="E-mail" required>
                        <label for="username">E-mail</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Senha" required>
                        <label for="password">Senha</label>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-neon btn-lg fw-bold">Entrar</button>
                    </div>
                </form>

                <div class="mt-3">
                    <a href="/cadastro" class="text-decoration-none" style="color: #00ffaa; font-size: 0.9rem;">
                        Não tem conta? <strong>Cadastre-se</strong>
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
