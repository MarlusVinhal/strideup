<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StrideUp - Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            /* Caminho absoluto com a barra inicial / garante que a imagem carrega sempre */
            background-image: url('/img/fundo-run.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 0;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 1.5rem;
            color: #ffffff;
            position: relative;
            z-index: 1;
        }

        .icon-running {
            display: inline-block;
            color: #00ffaa;
            filter: drop-shadow(0 0 8px rgba(0,255,170,0.8));
            animation: run-motion 0.5s infinite alternate ease-in-out;
        }
        @keyframes run-motion {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(12deg); }
        }

        .text-animated {
            background: linear-gradient(90deg, #00ffaa 0%, #ffffff 50%, #00ffaa 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
            display: inline-block;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }

        .form-control {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }
        .form-control:focus {
            background-color: rgba(0, 0, 0, 0.4);
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
            color: #ffffff;
        }
        .btn-neon {
            background: transparent;
            color: #00ffaa;
            border: 2px solid #00ffaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }
        .btn-neon:hover {
            background: #00ffaa;
            color: #000000;
            box-shadow: 0 0 20px #00ffaa;
        }
    </style>
</head>
<body>
<div class="page-overlay"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
            <div class="card card-custom p-4 p-md-5">

                <div th:if="${param.erro}" class="alert alert-danger text-center fw-bold" style="background: rgba(220,53,69,0.7); color: white; border: none;">
                    Nome ou e-mail já cadastrados!
                </div>
                <div th:if="${param.sucesso}" class="alert alert-success text-center fw-bold" style="background: rgba(25,135,84,0.7); color: white; border: none;">
                    Conta criada com sucesso!
                </div>

                <div class="text-center mb-4">
                    <h2 class="fw-bold mb-2" style="font-size: 2.5rem;">
                        <i class="fas fa-running me-2 icon-running"></i><span class="text-animated">StrideUp</span>
                    </h2>
                </div>

                <form th:action="@{/cadastrar}" method="post">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" name="nome" placeholder="Nome" required>
                        <label>Nome de Usuário</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" name="email" placeholder="E-mail" required>
                        <label>E-mail</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" name="senha" placeholder="Senha" required>
                        <label>Senha</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-neon btn-lg fw-bold">Criar Conta</button>
                    </div>
                </form>

                <div class="mt-4 text-center">
                    <a href="/login" class="text-decoration-none" style="color: #00ffaa; font-size: 0.9rem;">
                        Já tem uma conta? <strong>Faça Login aqui</strong>
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
